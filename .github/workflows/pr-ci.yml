name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm AutoHotkey script is present
        run: test -s MacKeyboard.ahk
      - name: Whitespace errors
        run: git diff --check
